<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Milk Run</title><style>
*{box-sizing:border-box}body{margin:0;background:#101825;color:#eef6ff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}main{width:min(100%,1000px)}header,footer{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:5px 0 12px}.stage{position:relative;border:2px solid #52657c;border-radius:16px;overflow:hidden}canvas{display:block;width:100%;background:#152536}#overlay{position:absolute;inset:0;background:#0a1424df;display:grid;place-items:center;text-align:center;padding:24px}#overlay[hidden]{display:none}h2{font-size:36px;margin:8px}p{line-height:1.6;color:#c0d0e2}button{padding:12px 20px;background:#ffe19a;color:#192637;border:0;border-radius:8px;font:inherit;font-weight:bold;cursor:pointer}footer{font-size:13px;color:#b9cbdd;margin-top:12px}.controls{display:flex;justify-content:center;gap:10px;margin-top:14px}.controls button{touch-action:none;user-select:none}#status{color:#ffe19a}
</style></head><body><main><header><h1>Milk Run</h1><span id="status">Dummies: 0 / 5</span></header><div class="stage"><canvas id="game" width="1000" height="520" aria-label="Parkour shooting game. Left and right arrows move, up arrow jumps, E shoots."></canvas><div id="overlay"><div><h2 id="title">The milk is over there.</h2><p id="message">Jump across the rooftops, shoot the training dummies,<br>and collect the carton of milk at the other end.<br>← → Move · ↑ Jump · E Shoot<br>Your gun fires in the direction you face.</p><button id="start">Start run</button></div></div></div><footer><span>← → Move · ↑ Jump · E Shoot · R Restart</span><span>Fall? Restart and try again.</span></footer><div class="controls"><button data-key="ArrowLeft" aria-label="Move left">←</button><button data-key="ArrowRight" aria-label="Move right">→</button><button data-key="ArrowUp">Jump</button><button data-key="KeyE">Shoot</button></div></main>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const platforms=[{x:0,y:440,w:420},{x:500,y:390,w:220},{x:800,y:330,w:220},{x:1100,y:390,w:220},{x:1400,y:320,w:250},{x:1740,y:380,w:220},{x:2040,y:320,w:260},{x:2380,y:400,w:220},{x:2680,y:350,w:340}];
const dummySpots=[{x:620,y:390},{x:910,y:330},{x:1510,y:320},{x:2170,y:320},{x:2510,y:400}];
let state='ready',player,dummies,bullets,particles,camera=0,last=0,cooldown=0,jumpHeld=false;
const keys=new Set(),touch=new Map();
function clear(){keys.clear();touch.clear();jumpHeld=false;}
function setup(){player={x:90,y:380,w:26,h:46,vx:0,vy:0,face:1,ground:false};dummies=dummySpots.map(d=>({...d,hp:2}));bullets=[];particles=[];camera=0;cooldown=0;clear();$('status').textContent='Dummies: 0 / 5';}
function start(){setup();state='playing';last=0;$('overlay').hidden=true;}
function end(won){state=won?'won':'lost';clear();$('overlay').hidden=false;$('title').textContent=won?'Milk acquired!':'Mind the gap!';$('message').textContent=won?'You knocked down every dummy and made it across the rooftops. Mission complete!':'You fell off the course. Jump near the edge and keep moving through the air.';$('start').textContent='Try again';}
function update(dt){if(state!=='playing')return;const held=new Set([...keys,...touch.values()]);const dir=(held.has('ArrowRight')?1:0)-(held.has('ArrowLeft')?1:0);player.vx=dir*270;if(dir)player.face=dir;
const jump=held.has('ArrowUp');if(jump&&!jumpHeld&&player.ground){player.vy=-620;player.ground=false;}jumpHeld=jump;
const oldBottom=player.y+player.h;player.vy+=1500*dt;player.x=Math.max(0,Math.min(2994,player.x+player.vx*dt));player.y+=player.vy*dt;player.ground=false;
for(const p of platforms)if(player.vy>=0&&oldBottom<=p.y+1&&player.y+player.h>=p.y&&player.x+player.w>p.x&&player.x<p.x+p.w){player.y=p.y-player.h;player.vy=0;player.ground=true;}
if(player.y>620){end(false);return;}
cooldown-=dt;if(held.has('KeyE')&&cooldown<=0){cooldown=.18;bullets.push({x:player.x+13+player.face*24,y:player.y+22,vx:player.face*820,life:1});}
for(const b of bullets){const oldX=b.x;b.x+=b.vx*dt;b.life-=dt;for(const d of dummies)if(d.hp>0&&b.life>0&&b.y>=d.y-52&&b.y<=d.y&&Math.max(oldX,b.x)>=d.x-17&&Math.min(oldX,b.x)<=d.x+17){d.hp--;b.life=0;for(let i=0;i<7;i++)particles.push({x:d.x,y:b.y,vx:(Math.random()-.5)*160,vy:-Math.random()*150,life:.4});}}
bullets=bullets.filter(b=>b.life>0);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;}particles=particles.filter(p=>p.life>0);
const defeated=dummies.filter(d=>d.hp<=0).length;$('status').textContent=`Dummies: ${defeated} / 5`;if(player.x+player.w>2880&&player.x<2930&&player.y+player.h>=300&&player.y<=350){if(defeated===5){end(true);return;}$('status').textContent=`Knock down ${5-defeated} remaining dummies to collect milk!`;}
camera=Math.max(0,Math.min(2020,player.x-330));}
function draw(){ctx.fillStyle='#14283c';ctx.fillRect(0,0,1000,520);ctx.fillStyle='#d1e9e9';ctx.beginPath();ctx.arc(810-camera*.06,80,33,0,Math.PI*2);ctx.fill();ctx.fillStyle='#233e52';for(let i=0;i<22;i++){const x=i*110-camera*.25,h=70+(i*37)%140;ctx.fillRect(x,440-h,78,h);}ctx.save();ctx.translate(-camera,0);
for(const p of platforms){ctx.fillStyle='#344d63';ctx.fillRect(p.x,p.y,p.w,520-p.y);ctx.fillStyle='#79d8c1';ctx.fillRect(p.x,p.y,p.w,7);ctx.fillStyle='#20374a';for(let x=p.x+18;x<p.x+p.w-15;x+=35)ctx.fillRect(x,p.y+30,15,25);}
ctx.font='bold 16px system-ui';ctx.fillStyle='#ffe19a';ctx.fillText('MILK →',2750,295);
for(const d of dummies){if(d.hp<=0){ctx.fillStyle='#a8875b';ctx.fillRect(d.x-22,d.y-9,44,9);continue;}ctx.strokeStyle='#b39671';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(d.x,d.y-30);ctx.lineTo(d.x,d.y);ctx.moveTo(d.x-23,d.y-29);ctx.lineTo(d.x+23,d.y-29);ctx.stroke();ctx.fillStyle='#e5b675';ctx.beginPath();ctx.arc(d.x,d.y-43,10,0,Math.PI*2);ctx.fill();ctx.fillRect(d.x-13,d.y-32,26,23);ctx.strokeStyle='#bb5156';ctx.lineWidth=3;ctx.beginPath();ctx.arc(d.x,d.y-22,7,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffdb8c';ctx.fillRect(d.x-15,d.y-62,d.hp*15,4);}
ctx.fillStyle='#fff4dc';ctx.fillRect(2890,314,27,36);ctx.fillStyle='#88cbe6';ctx.fillRect(2890,327,27,14);ctx.beginPath();ctx.moveTo(2890,314);ctx.lineTo(2898,304);ctx.lineTo(2917,314);ctx.fill();ctx.fillStyle='#153b58';ctx.font='bold 9px system-ui';ctx.fillText('MILK',2892,337);
const p=player,step=p.ground&&p.vx?Math.sin(p.x*.09)*5:0;ctx.fillStyle='#19202f';ctx.fillRect(p.x+3,p.y+32,8,14+step);ctx.fillRect(p.x+16,p.y+32,8,14-step);ctx.fillStyle='#ffcd72';ctx.fillRect(p.x+1,p.y+14,24,22);ctx.fillStyle='#f5c3a5';ctx.beginPath();ctx.arc(p.x+13,p.y+7,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2e5168';ctx.fillRect(p.x+2,p.y-3,22,7);ctx.fillStyle='#172431';ctx.fillRect(p.x+13+(p.face===1?4:-27),p.y+19,27,8);ctx.fillStyle='#ffffff';for(const b of bullets)ctx.fillRect(b.x-5,b.y-2,10,4);ctx.fillStyle='#ffce72';for(const s of particles)ctx.fillRect(s.x,s.y,4,4);ctx.restore();}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','KeyE'].includes(e.code)){e.preventDefault();keys.add(e.code);}if(e.code==='KeyR'&&!e.repeat)start();});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',clear);document.addEventListener('visibilitychange',()=>{last=0;clear();});
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touch.set(e.pointerId,b.dataset.key);};for(const name of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(name,e=>touch.delete(e.pointerId));}
$('start').onclick=start;function frame(now){const dt=last?Math.min((now-last)/1000,.05):0;last=now;if(!document.hidden){const steps=Math.max(1,Math.ceil(dt*120));for(let i=0;i<steps;i++)update(dt/steps);}draw();requestAnimationFrame(frame);}setup();if(new URLSearchParams(location.search).get('autostart')==='1')start();requestAnimationFrame(frame);
</script></body></html>
